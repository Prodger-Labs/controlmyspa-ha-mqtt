name: Build container

on: push

jobs:
  build-container:
    name: Build container
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Build (no push)
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        file: Dockerfile
        push: false
        load: true
        tags: controlmyspa-ha-mqtt:ci
    - name: Scan the image for fixable critical vulnerabilities
      # Fails only on a CRITICAL that has a fixed version published. A critical
      # with no fix yet is left out: there is nothing to upgrade to.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: controlmyspa-ha-mqtt:ci
        scanners: vuln
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: '1'

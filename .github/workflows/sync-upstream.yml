name: Sync upstream

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/mikakoivisto/controlmyspa-ha-mqtt.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Check for new commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch and merge
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH="sync-upstream-$(date +%Y-%m-%d)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git merge upstream/master --no-edit

      # Upstream has not moved config.yaml off "1.0.7" since Dec 2022. The
      # Supervisor decides whether to rebuild a local-build add-on purely from
      # that version string, so an unbumped sync ships nothing to the Green and
      # the add-on keeps running a stale image. That is how the July 2026
      # ControlMySpa auth fix sat unshipped until the old endpoint 404'd.
      - name: Bump patch version so the Supervisor actually rebuilds
        if: steps.check.outputs.has_changes == 'true'
        run: |
          CURRENT=$(sed -n 's/^version: "\(.*\)"$/\1/p' config.yaml)
          if [ -z "$CURRENT" ]; then
            echo "Could not read version from config.yaml" >&2
            exit 1
          fi
          MAJOR=${CURRENT%%.*}
          REST=${CURRENT#*.}
          MINOR=${REST%%.*}
          PATCH=${REST#*.}
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "s/^version: \"$CURRENT\"$/version: \"$NEXT\"/" config.yaml
          grep -q "^version: \"$NEXT\"$" config.yaml || { echo "Version bump did not apply" >&2; exit 1; }
          echo "NEXT_VERSION=$NEXT" >> "$GITHUB_ENV"
          git commit -am "Bump add-on version to $NEXT for upstream sync"

      - name: Push sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: git push origin "$BRANCH"

      - name: Open PR
        if: steps.check.outputs.has_changes == 'true'
        run: |
          gh pr create \
            --title "Monthly sync with upstream (v$NEXT_VERSION)" \
            --body "Automated monthly pull from mikakoivisto/controlmyspa-ha-mqtt, with the add-on version bumped to $NEXT_VERSION so the Supervisor rebuilds. Review before merging, because our local fix (useCelsius in lib/spa.js) could conflict with or be superseded by upstream changes." \
            --base master \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
